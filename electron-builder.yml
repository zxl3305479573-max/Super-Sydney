appId: com.sydney.workos
productName: Sydney
copyright: Copyright © 2026 Sydney

directories:
  output: release

# NSIS 构建会生成 latest.yml 和 Setup.exe.blockmap；electron-updater 从此 GitHub
# Releases 源读取它们。发布仍由发版流程人工上传，构建本身不会推送任何远程内容。
publish:
  provider: github
  owner: zxl3305479573-max
  repo: Super-Sydney
  releaseType: release

electronDist: node_modules/electron/dist

files:
  - out/**/*
  - package.json

asar: true
asarUnpack:
  - node_modules/active-win/**/*
npmRebuild: false

win:
  icon: desktop/assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: Sydney-Setup-${version}-${arch}.${ext}
  differentialPackage: true
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Sydney
  uninstallDisplayName: Sydney
  installerLanguages:
    - zh_CN
  deleteAppDataOnUninstall: false
  runAfterFinish: true

portable:
  artifactName: Sydney-Portable-${version}-${arch}.${ext}
