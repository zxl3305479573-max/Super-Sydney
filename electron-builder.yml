appId: com.sydney.workos
productName: Sydney
copyright: Copyright © 2026 Sydney

directories:
  output: release

files:
  - out/**/*
  - package.json

asar: true
asarUnpack:
  - node_modules/active-win/**/*
npmRebuild: false

publish:
  provider: github
  owner: zxl3305479573-max
  repo: Super-Sydney
  releaseType: release

win:
  icon: desktop/assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: Sydney-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Sydney
  uninstallDisplayName: Sydney
  installerLanguages:
    - zh_CN
  deleteAppDataOnUninstall: false
  runAfterFinish: true

portable:
  artifactName: Sydney-Portable-${version}-${arch}.${ext}
